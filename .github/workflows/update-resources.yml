name: Update FOS Resources

on:
  workflow_dispatch:
    inputs:
      module_id:
        description: 'Module to export from its development workspace'
        required: true
        type: choice
        options:
          - admin-monitoring
          - fabric-cost-analysis
        default: admin-monitoring
  #schedule:
  #  - cron: '0 6 * * 1'  # Run every Monday at 6 AM UTC
  #push:
  #  branches:
  #    - main
  #  paths:
  #    - 'cicd/modules/admin-monitoring/item_src_config.yaml'
  #    - 'config/modules/admin-monitoring/deployment_config.yaml'
  #    - 'cicd/export_module.py'

env:
  MODULE_ID: ${{ github.event.inputs.module_id }}
  PYTHON_VERSION: '3.11'
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'

jobs:
  update-resources:
    runs-on: windows-latest
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          # Add any other Python dependencies your script might need
      
      - name: Install Microsoft Fabric CLI
        run: |
          # Install Fabric CLI via pip
          pip install ms-fabric-cli
      
      - name: Authenticate with Microsoft Fabric
        run: |
          # Configure Fabric CLI authentication
          # You'll need to set up service principal authentication
          fab auth login -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
        env:
          FAB_SPN_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          FAB_SPN_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          FAB_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      
      - name: Run FOS Get Resources Script
        run: |
          python cicd/export_module.py --module ${{ env.MODULE_ID }}
        env:
          # Add any environment variables your script might need
          PYTHONPATH: ${{ github.workspace }}
          PYTHONIOENCODING: 'utf-8'
          PYTHONUTF8: '1'
      
      - name: Check for changes
        id: check_changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are any changes
          $hasChanges = $false
          try {
            git diff --quiet
            $diffExitCode = $LASTEXITCODE
            git diff --staged --quiet
            $stagedExitCode = $LASTEXITCODE
            
            if ($diffExitCode -ne 0 -or $stagedExitCode -ne 0) {
              $hasChanges = $true
            }
          } catch {
            $hasChanges = $true
          }
          
          if ($hasChanges) {
            echo "changes=true" >> $env:GITHUB_OUTPUT
            echo "Changes detected"
          } else {
            echo "changes=false" >> $env:GITHUB_OUTPUT
            echo "No changes detected"
          }
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add "src/modules/${{ env.MODULE_ID }}/" "config/modules/${{ env.MODULE_ID }}/"
          git commit -m "chore: update FOS resources from source workspace
          
          - Updated src folder with latest exports
          - Updated ${{ env.MODULE_ID }} module sources and deployment_order.json
          - Processed by export_module.py
          
          Generated on: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss UTC'))"
          
          git push origin HEAD
      
            
      - name: Summary
        run: |
          echo "## 📊 FOS Resource Update Summary" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Execution Time**: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss UTC'))" >> $env:GITHUB_STEP_SUMMARY
          echo "**Changes Detected**: ${{ steps.check_changes.outputs.changes }}" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          
          if ("${{ steps.check_changes.outputs.changes }}" -eq "true") {
            echo "### 📁 Updated Files:" >> $env:GITHUB_STEP_SUMMARY
            try {
              git diff --name-only HEAD~1 HEAD | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
            } catch {
              echo "- No previous commit to compare" >> $env:GITHUB_STEP_SUMMARY
            }
          } else {
            echo "### ✅ No changes required" >> $env:GITHUB_STEP_SUMMARY
            echo "All resources are up to date with the source workspace." >> $env:GITHUB_STEP_SUMMARY
          }
