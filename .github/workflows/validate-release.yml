name: Validate FOS Release

on:
  pull_request:
    paths:
      - 'cicd/release/**'
      - 'config/release.yaml'
      - 'config/modules/**'
      - 'data/modules/**'
      - 'src/modules/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validation dependencies
        run: pip install pyyaml

      - name: Run composer tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate release composition
        run: python cicd/release/compose_release.py --output "${RUNNER_TEMP}/fos-release"